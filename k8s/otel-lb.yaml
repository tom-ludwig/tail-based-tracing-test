# Trace load balancer — the entry point for app OTLP traffic.
# Sole job: receive OTLP, hash by traceID, forward to the correct
# otel-tail-sampler pod so all spans of a trace land on the same
# tail_sampling instance.
#
# Topology options
# ────────────────
# Option A — Deployment (current, default)
#   Apps send to the ClusterIP Service:
#     otel-lb.observability.svc.cluster.local:4317
#   Two replicas provide redundancy; the loadbalancing exporter hashes
#   by traceID so all spans for a trace reach the same tail-sampler pod.
#
# Option B — DaemonSet
#   Switch `mode` to `daemonset` and remove `replicaCount`.
#   Apps use the node IP instead of the Service (see test-deployment.yaml
#   Option B comment for the required env-var change).
#   Trade-off: eliminates one cross-node hop per span, but runs one
#   collector pod per node — higher total resource footprint.
#   When switching to daemonset also update the networkPolicy below to
#   allow ingress from all pod CIDRs on port 4317 (node-local traffic
#   bypasses the ClusterIP and arrives as host-network traffic).
#
# No enrichment, no sampling — keep this tier as thin as possible.
#
# Install:
#   helm upgrade --install otel-lb opentelemetry-helm/opentelemetry-collector \
#     --namespace observability --create-namespace \
#     -f otel-lb.yaml

mode: daemonset
# mode: deployment
# replicaCount: 2
fullnameOverride: otel-lb

image:
  repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-k8s
command:
  name: otelcol-k8s

resources:
  requests:
    memory: "256Mi"
    cpu: "250m"
  limits:
    memory: "512Mi"

ports:
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false
  metrics:
    enabled: true

serviceMonitor:
  enabled: true
  metricsEndpoints:
    - port: metrics

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# The k8s resolver in the loadbalancing exporter watches Endpoints/EndpointSlices
# of the otel-tail-sampler headless service. That requires API access.
clusterRole:
  create: true
  rules:
    - apiGroups: [""]
      resources: ["endpoints"]
      verbs: ["list", "watch", "get"]
    - apiGroups: ["discovery.k8s.io"]
      resources: ["endpointslices"]
      verbs: ["list", "watch", "get"]

config:
  extensions:
    health_check:
      endpoint: 0.0.0.0:13133

  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  processors:
    memory_limiter:
      check_interval: 1s
      limit_percentage: 75
      spike_limit_percentage: 20
    batch:
      send_batch_size: 2048
      send_batch_max_size: 4096
      timeout: 200ms

  exporters:
    loadbalancing:
      routing_key: traceID
      protocol:
        otlp:
          timeout: 5s
          tls:
            insecure: true
      resolver:
        k8s:
          # Headless service of the otel-tail-sampler release; resolves to per-pod IPs.
          service: otel-tail-sampler.observability.svc.cluster.local
          ports:
            - 4317

  service:
    telemetry:
      logs:
        level: WARN
        encoding: json
    extensions:
      - health_check
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [loadbalancing]

# Edge tier does no enrichment — that runs once on otel-tail-sampler.
presets:
  resourceDetection:
    enabled: false

networkPolicy:
  enabled: true
