apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-tail-sampler
  namespace: observability
spec:
  mode: statefulset
  replicas: 2
  image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-k8s:latest

  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"

  podManagementPolicy: OrderedReady

  podDisruptionBudget:
    minAvailable: 1

  observability:
    metrics:
      enableMetrics: true

  # DOESN"T WORK: " Enables k8s.* and host.* attributes via the operator's preset
  # env:
  #   - name: OTEL_RESOURCE_ATTRIBUTES_NODE_NAME
  #     valueFrom:
  #       fieldRef:
  #         fieldPath: spec.nodeName

  ports:
    - name: otlp-grpc
      port: 4317
      protocol: TCP
    - name: otlp-http
      port: 4318
      protocol: TCP

  config:
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      # resourcedetection:
      #   detectors: [env, k8snode]
      #   timeout: 2s
      #   override: false

      resource/cluster:
        attributes:
          - key: cluster.name
            value: "lucenhq-prod-eu01"
            action: upsert

      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 20

      tail_sampling:
        decision_wait: 15s
        num_traces: 2500
        expected_new_traces_per_sec: 500
        policies:
          - name: keep-errors
            type: status_code
            status_code:
              status_codes: [ERROR]
          - name: keep-slow-traces
            type: latency
            latency:
              threshold_ms: 1000
          - name: sample-baseline
            type: probabilistic
            probabilistic:
              sampling_percentage: 1

      filter/server_spans:
        error_mode: ignore
        traces:
          span:
            - "kind != SPAN_KIND_SERVER"

      batch:
        send_batch_size: 8192
        send_batch_max_size: 16384
        timeout: 200ms

    connectors:
      forward/sampled: {}
      forward/metrics: {}
      span_metrics:
        namespace: traces_span_metrics
        histogram:
          explicit:
            buckets:
              [
                2ms,
                4ms,
                6ms,
                8ms,
                10ms,
                50ms,
                100ms,
                200ms,
                400ms,
                800ms,
                1s,
                1400ms,
                2s,
                5s,
                10s,
                15s,
              ]
        dimensions:
          - name: http.method
          - name: http.status_code
          - name: http.route
          - name: rpc.method
          - name: rpc.service
        exemplars:
          enabled: false # TODO: Enable with VMSingle
        # metrics_flush_interval: 60s

    exporters:
      otlp_http/vtsingle:
        endpoint: "http://vtsingle-vt-single.monitoring.svc.cluster.local:10428/insert/opentelemetry"
      otlp_http/vmsingle:
        endpoint: "http://vmsingle-vm-single.monitoring.svc:8428/opentelemetry"

    service:
      telemetry:
        logs:
          level: WARN
          encoding: json
      extensions:
        - health_check
      pipelines:
        # Receives 100% of traces; forwards to both the tail-sampling pipeline
        # and the spanmetrics connector (which sees 100% of spans).
        traces/all:
          receivers:
            - otlp
          processors:
            - memory_limiter
            # - resourcedetection
            - resource/cluster
          exporters:
            - forward/sampled
            - forward/metrics

        # Filters to server spans only before generating RED metrics.
        traces/metrics:
          receivers:
            - forward/metrics
          processors:
            - filter/server_spans
          exporters:
            - span_metrics

        # Applies tail-sampling and stores survivors in VictoriaTraces.
        traces/sampled:
          receivers:
            - forward/sampled
          processors:
            - tail_sampling
            - batch
          exporters:
            - otlp_http/vtsingle

        # Converts 100% of trace spans into RED metrics and ships to VictoriaMetrics.
        metrics/spanmetrics:
          receivers:
            - span_metrics
          exporters:
            - otlp_http/vmsingle
