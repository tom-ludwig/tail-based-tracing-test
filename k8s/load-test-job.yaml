apiVersion: v1
kind: ConfigMap
metadata:
  name: load-test-script
data:
  load-test.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    URL="${URL:-http://tail-based-tracing-test.default.svc.cluster.local:8080}"
    SUCCESS_N="${SUCCESS_N:-10000}"
    LATENCY_N="${LATENCY_N:-5}"
    FAILURE_N="${FAILURE_N:-20}"
    HEAVY_N="${HEAVY_N:-500}"
    CONCURRENCY="${CONCURRENCY:-100}"

    TOTAL=$((SUCCESS_N + LATENCY_N + FAILURE_N + HEAVY_N))

    echo "Target:        $URL"
    echo "Success:       $SUCCESS_N"
    echo "Latency:       $LATENCY_N"
    echo "Failure:       $FAILURE_N"
    echo "Heavy:         $HEAVY_N"
    echo "Total:         $TOTAL"
    echo "Concurrency:   $CONCURRENCY"
    echo

    build_targets() {
      for ((i = 0; i < SUCCESS_N; i++)); do echo /success; done
      for ((i = 0; i < LATENCY_N; i++)); do echo /latency; done
      for ((i = 0; i < FAILURE_N; i++)); do echo /failure; done
      for ((i = 0; i < HEAVY_N; i++)); do echo /heavy; done
    }

    hit() {
      local path="$1"
      local code
      code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "${URL}${path}" || echo "ERR")
      printf '%s %s\n' "$path" "$code"
    }
    export -f hit
    export URL

    start=$(date +%s)

    results=$(build_targets | shuf | xargs -P "$CONCURRENCY" -I {} bash -c 'hit "$@"' _ {})

    elapsed=$(( $(date +%s) - start ))

    echo "Results (path, status, count):"
    printf '%s\n' "$results" | sort | uniq -c | awk '{printf "  %-10s %-5s %s\n", $2, $3, $1}'
    echo
    printf 'Elapsed: %ss  (%.0f req/s)\n' "$elapsed" "$(awk -v t=$TOTAL -v e=$elapsed 'BEGIN{ if (e==0) print t; else print t/e }')"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: load-test
spec:
  ttlSecondsAfterFinished: 600
  parallelism: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: load-test
          image: alpine:3.21
          command:
            [
              "/bin/sh",
              "-c",
              "apk add --no-cache bash curl coreutils && bash /scripts/load-test.sh",
            ]
          env:
            - name: URL
              value: "http://tail-based-tracing-test.default.svc.cluster.local:8080"
            - name: SUCCESS_N
              value: "100"
            - name: LATENCY_N
              value: "50"
            - name: FAILURE_N
              value: "200"
            - name: HEAVY_N
              value: "10000"
            - name: CONCURRENCY
              value: "15"
          volumeMounts:
            - name: script
              mountPath: /scripts
          resources:
            requests:
              cpu: 200m
              memory: 64Mi
            limits:
              cpu: 4000m
              # memory: 528Mi
      volumes:
        - name: script
          configMap:
            name: load-test-script
            defaultMode: 0755
